<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBB Member Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #172033;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      height: 76px;
      background: #ffffff;
      border-bottom: 1px solid #e9edf3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #172033;
    }

    .logo span {
      color: #c58b2a;
    }

    .back-link {
      text-decoration: none;
      color: #596579;
      font-size: 14px;
      font-weight: 600;
    }

    .back-link:hover {
      color: #c58b2a;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 55px 20px;
      background:
        radial-gradient(circle at 15% 20%, rgba(197,139,42,0.08), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(31,60,100,0.07), transparent 30%),
        #f7f9fc;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid #e6eaf0;
      border-radius: 18px;
      padding: 42px;
      box-shadow: 0 18px 55px rgba(23,32,51,0.10);
    }

    .badge {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: #172033;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      line-height: 1.2;
      letter-spacing: -0.7px;
      color: #172033;
    }

    .subtitle {
      margin: 10px 0 30px;
      color: #697588;
      font-size: 15px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #263247;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d9dfe8;
      border-radius: 9px;
      background: #ffffff;
      color: #172033;
      font-size: 15px;
      outline: none;
      transition: 0.2s ease;
    }

    input::placeholder {
      color: #9aa4b3;
    }

    input:focus {
      border-color: #c58b2a;
      box-shadow: 0 0 0 3px rgba(197,139,42,0.12);
    }

    .login-btn {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 15px;
      margin-top: 4px;
      background: #172033;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .login-btn:hover {
      background: #24324a;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(23,32,51,0.16);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    #message {
      min-height: 20px;
      margin-top: 16px;
      text-align: center;
      color: #c0392b;
      font-size: 14px;
      line-height: 1.5;
    }

    .secure {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #edf0f4;
      text-align: center;
      color: #8791a0;
      font-size: 12px;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 22px;
      color: #8a94a3;
      font-size: 12px;
      background: #ffffff;
      border-top: 1px solid #e9edf3;
    }

    @media (max-width: 600px) {
      .header {
        padding: 0 20px;
      }

      .login-card {
        padding: 30px 23px;
        border-radius: 15px;
      }

      h1 {
        font-size: 25px;
      }

      .main {
        padding: 35px 16px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="header">
      <div class="logo">
        India Business <span>Bureau</span>
      </div>

      <a class="back-link" href="index.html">
        ← Back to Home
      </a>
    </header>

    <main class="main">

      <div class="login-card">

        <div class="badge">IBB</div>

        <h1>Welcome back</h1>

        <p class="subtitle">
          Sign in to access your IBB member training and continue your learning journey.
        </p>

        <form id="loginForm">

          <div class="field">
            <label for="email">Email address</label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
          </div>

          <button
            class="login-btn"
            id="loginBtn"
            type="submit"
          >
            Login to Member Area
          </button>

          <div id="message"></div>

        </form>

        <div class="secure">
          🔒 Secure member access
        </div>

      </div>

    </main>

    <footer class="footer">
      © India Business Bureau · Member Training Platform
    </footer>

  </div>

  <script>
    const SUPABASE_URL = "https://tvantyrkjxoljjpnadac.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_t0Z_jIqNeUde0fZ4YS8h3Q_fQHLO_GV";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(e) {

        e.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        const loginBtn =
          document.getElementById("loginBtn");

        message.textContent = "";
        message.style.color = "#c0392b";

        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {

          message.textContent = error.message;

          loginBtn.disabled = false;
          loginBtn.textContent = "Login to Member Area";

          return;
        }

        message.style.color = "#2e7d32";
        message.textContent = "Login successful!";

        window.location.href = "training.html";
      });
  </script>

</body>
</html>
