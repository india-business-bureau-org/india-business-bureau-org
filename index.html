<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Indian Business Bureau | People. Businesses. Opportunities.</title>

  <meta name="description"
        content="Indian Business Bureau connects businesses with people through structured campaigns, tasks and opportunities. Join IBB for ₹101.">

  <meta name="theme-color" content="#07090d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#07090d;
      --bg-soft:#0b0f15;
      --card:#10151c;
      --card2:#0d1218;
      --line:rgba(255,255,255,.09);
      --line-gold:rgba(227,194,112,.22);

      --text:#f6f7f9;
      --muted:#a0a8b5;
      --dim:#727b89;

      --gold:#e5c675;
      --gold2:#f1d98e;
      --green:#54c99b;

      --max:1120px;
      --radius:22px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
      scroll-padding-top:82px;
    }

    body{
      font-family:Inter,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 85% 0%,rgba(229,198,117,.10),transparent 28%),
        radial-gradient(circle at 5% 35%,rgba(84,201,155,.055),transparent 23%),
        var(--bg);
      line-height:1.6;
      overflow-x:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font:inherit;
    }

    .container{
      width:min(var(--max),calc(100% - 34px));
      margin:auto;
    }

    /* =========================
       HEADER
    ========================= */

    header{
      position:sticky;
      top:0;
      z-index:100;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:rgba(7,9,13,.82);
      backdrop-filter:blur(18px);
    }

    .nav{
      min-height:74px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:25px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      min-width:max-content;
    }

    .brand-mark{
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:12px;
      border:1px solid rgba(229,198,117,.30);
      background:
        linear-gradient(145deg,rgba(229,198,117,.13),rgba(255,255,255,.035));
      box-shadow:inset 0 0 20px rgba(229,198,117,.04);
    }

    .brand-mark svg{
      width:24px;
      height:24px;
    }

    .brand-text{
      line-height:1.05;
    }

    .brand-name{
      font-family:Manrope,sans-serif;
      font-weight:800;
      font-size:15px;
      letter-spacing:-.35px;
    }

    .brand-name span{
      color:var(--gold);
    }

    .brand-sub{
      font-size:8px;
      color:var(--dim);
      letter-spacing:1.15px;
      text-transform:uppercase;
      margin-top:3px;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:24px;
      color:#adb5c1;
      font-size:12px;
      font-weight:600;
    }

    .nav-links a:hover{
      color:#fff;
    }

    .nav-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border-radius:12px;
      border:1px solid var(--line);
      padding:13px 18px;
      font-size:12px;
      font-weight:800;
      transition:.2s ease;
      cursor:pointer;
      white-space:nowrap;
    }

    .btn-primary{
      color:#111;
      background:linear-gradient(135deg,var(--gold2),#d5b259);
      box-shadow:0 10px 28px rgba(229,198,117,.12);
    }

    .btn-primary:hover{
      transform:translateY(-2px);
      box-shadow:0 15px 38px rgba(229,198,117,.18);
    }

    .btn-secondary{
      color:#f4f5f7;
      background:rgba(255,255,255,.025);
    }

    .btn-secondary:hover{
      background:rgba(255,255,255,.06);
    }

    /* =========================
       HERO
    ========================= */

    .hero{
      padding:88px 0 75px;
    }

    .hero-grid{
      display:grid;
      grid-template-columns:1.08fr .92fr;
      gap:55px;
      align-items:center;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 11px;
      border-radius:999px;
      border:1px solid rgba(229,198,117,.20);
      background:rgba(229,198,117,.055);
      color:var(--gold);
      font-size:9px;
      font-weight:800;
      letter-spacing:1.4px;
    }

    h1{
      font-family:Manrope,sans-serif;
      font-size:clamp(44px,6vw,70px);
      line-height:1.01;
      letter-spacing:-3.4px;
      margin-top:20px;
    }

    h1 span{
      background:linear-gradient(90deg,#fff,var(--gold));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .hero-copy{
      max-width:600px;
      margin-top:20px;
      color:var(--muted);
      font-size:16px;
    }

    .hero-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:28px;
    }

    .hero-note{
      color:var(--dim);
      font-size:10px;
      margin-top:12px;
    }

    /* ecosystem */

    .ecosystem{
      min-height:360px;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .orbit{
      position:absolute;
      width:270px;
      height:270px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.07);
    }

    .orbit.small{
      width:180px;
      height:180px;
      border-color:rgba(229,198,117,.14);
    }

    .core{
      width:102px;
      height:102px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 35% 30%,rgba(229,198,117,.11),transparent 55%),
        #111720;
      border:1px solid rgba(229,198,117,.33);
      color:var(--gold);
      font-family:Manrope,sans-serif;
      font-size:25px;
      font-weight:800;
      letter-spacing:-1px;
      z-index:2;
      box-shadow:0 0 70px rgba(229,198,117,.08);
    }

    .node{
      position:absolute;
      padding:9px 12px;
      border-radius:11px;
      border:1px solid var(--line);
      background:rgba(11,15,21,.90);
      font-size:10px;
      font-weight:800;
      color:#d9dee5;
    }

    .node.people{
      top:20px;
    }

    .node.business{
      right:0;
    }

    .node.tasks{
      bottom:20px;
    }

    .node.opportunities{
      left:0;
    }

    /* =========================
       SECTIONS
    ========================= */

    section{
      padding:70px 0;
    }

    .section-head{
      max-width:660px;
      margin-bottom:28px;
    }

    .label{
      color:var(--gold);
      font-size:9px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:1.45px;
    }

    h2{
      font-family:Manrope,sans-serif;
      font-size:clamp(30px,4vw,44px);
      line-height:1.08;
      letter-spacing:-1.8px;
      margin-top:7px;
    }

    .sub{
      margin-top:10px;
      color:var(--muted);
      font-size:13px;
      max-width:700px;
    }

    /* =========================
       BUSINESS MODEL
    ========================= */

    .flow{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      border:1px solid var(--line);
      border-radius:20px;
      overflow:hidden;
    }

    .flow-item{
      padding:21px 16px;
      background:rgba(255,255,255,.022);
      border-right:1px solid var(--line);
    }

    .flow-item:last-child{
      border-right:0;
    }

    .flow-number{
      color:var(--gold);
      font-size:9px;
      font-weight:800;
    }

    .flow-title{
      font-size:13px;
      font-weight:800;
      margin-top:9px;
    }

    .flow-text{
      color:var(--muted);
      font-size:10px;
      margin-top:4px;
    }

    /* =========================
       EXAMPLE
    ========================= */

    .example{
      margin-top:18px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .example-card{
      padding:25px;
      border-radius:20px;
      border:1px solid var(--line-gold);
      background:
        radial-gradient(circle at 90% 0%,rgba(229,198,117,.08),transparent 35%),
        var(--card2);
    }

    .example-tag{
      display:inline-block;
      font-size:9px;
      color:var(--gold);
      font-weight:800;
      letter-spacing:1px;
      margin-bottom:9px;
    }

    .example-card h3{
      font-size:20px;
      line-height:1.25;
    }

    .example-card p{
      color:var(--muted);
      font-size:12px;
      margin-top:9px;
    }

    .math{
      margin-top:18px;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .math-box{
      padding:10px 13px;
      border-radius:11px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.025);
      font-size:12px;
      font-weight:700;
    }

    .math-result{
      padding:10px 14px;
      border-radius:11px;
      background:rgba(84,201,155,.09);
      border:1px solid rgba(84,201,155,.20);
      color:var(--green);
      font-weight:800;
      font-size:13px;
    }

    .tiny{
      margin-top:11px;
      color:var(--dim);
      font-size:9px;
    }

    /* =========================
       OPPORTUNITIES
    ========================= */

    .opportunity-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .opp{
      padding:18px;
      border-radius:15px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.025);
    }

    .opp strong{
      font-size:12px;
    }

    .opp span{
      display:block;
      color:var(--muted);
      font-size:10px;
      margin-top:4px;
    }

    /* =========================
       BUSINESS CTA
    ========================= */

    .business-box{
      padding:34px;
      border-radius:24px;
      border:1px solid rgba(84,201,155,.18);
      background:
        radial-gradient(circle at 90% 15%,rgba(84,201,155,.09),transparent 30%),
        rgba(255,255,255,.022);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:30px;
    }

    .business-copy{
      max-width:710px;
    }

    .business-copy p{
      margin-top:9px;
      color:var(--muted);
      font-size:13px;
    }

    /* =========================
       MEMBERSHIP
    ========================= */

    .membership{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .membership-card{
      padding:30px;
      border-radius:22px;
      border:1px solid var(--line-gold);
      background:
        radial-gradient(circle at 90% 0%,rgba(229,198,117,.10),transparent 35%),
        var(--card);
    }

    .price{
      font-family:Manrope,sans-serif;
      font-size:57px;
      line-height:1;
      letter-spacing:-3px;
      margin:9px 0;
    }

    .price small{
      font-family:Inter,sans-serif;
      color:var(--muted);
      font-size:11px;
      letter-spacing:0;
    }

    .membership-card p{
      color:var(--muted);
      font-size:12px;
      margin-bottom:20px;
      max-width:450px;
    }

    .benefits{
      display:grid;
      gap:9px;
    }

    .benefit{
      padding:14px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.025);
      font-size:12px;
    }

    .benefit span{
      color:var(--green);
      margin-right:5px;
    }

    /* =========================
       RATINGS
    ========================= */

    .rating-wrap{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:15px;
      margin-top:25px;
    }

    .rating-main,
    .rating-side{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:20px;
      padding:25px;
    }

    .rating-main{
      display:flex;
      align-items:center;
      gap:25px;
    }

    .rating-score{
      min-width:130px;
    }

    .rating-number{
      font-family:Manrope,sans-serif;
      font-size:43px;
      line-height:1;
    }

    .stars{
      color:var(--gold);
      letter-spacing:3px;
      font-size:14px;
      margin-top:8px;
    }

    .verified{
      display:inline-flex;
      margin-top:9px;
      padding:5px 8px;
      border-radius:999px;
      background:rgba(84,201,155,.08);
      border:1px solid rgba(84,201,155,.15);
      color:var(--green);
      font-size:9px;
      font-weight:800;
    }

    .rating-copy h3{
      font-size:16px;
    }

    .rating-copy p{
      color:var(--muted);
      font-size:11px;
      margin-top:5px;
    }

    .review-empty{
      color:var(--muted);
      font-size:11px;
      line-height:1.7;
    }

    .review-empty strong{
      color:white;
      display:block;
      margin-bottom:4px;
      font-size:13px;
    }

    /* =========================
       FAQ
    ========================= */

    .faq{
      max-width:820px;
    }

    details{
      border-bottom:1px solid var(--line);
    }

    summary{
      list-style:none;
      cursor:pointer;
      padding:17px 0;
      font-size:13px;
      font-weight:700;
    }

    summary::-webkit-details-marker{
      display:none;
    }

    details p{
      color:var(--muted);
      font-size:11px;
      padding:0 0 17px;
    }

    /* =========================
       FINAL
    ========================= */

    .final{
      padding:85px 0 100px;
      text-align:center;
    }

    .final p{
      max-width:570px;
      margin:11px auto 23px;
      color:var(--muted);
      font-size:13px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer{
      border-top:1px solid var(--line);
      padding:25px 0 85px;
      color:var(--dim);
      font-size:10px;
    }

    .footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
    }

    .footer-links{
      display:flex;
      flex-wrap:wrap;
      gap:16px;
    }

    .footer-links a:hover{
      color:white;
    }

    /* =========================
       MOBILE
    ========================= */

    .mobile-cta{
      display:none;
    }

    @media(max-width:850px){

      .nav-links{
        display:none;
      }

      .nav-actions .btn-secondary{
        display:inline-flex;
      }

      .nav-actions .btn{
        padding:11px 13px;
        font-size:10px;
      }

      .hero{
        padding:68px 0 55px;
      }

      .hero-grid{
        grid-template-columns:1fr;
        gap:25px;
      }

      .ecosystem{
        min-height:275px;
      }

      .flow{
        grid-template-columns:1fr;
      }

      .flow-item{
        border-right:0;
        border-bottom:1px solid var(--line);
      }

      .flow-item:last-child{
        border-bottom:0;
      }

      .example{
        grid-template-columns:1fr;
      }

      .opportunity-grid{
        grid-template-columns:1fr 1fr;
      }

      .business-box{
        flex-direction:column;
        align-items:flex-start;
      }

      .membership,
      .rating-wrap{
        grid-template-columns:1fr;
      }

      .mobile-cta{
        display:block;
        position:fixed;
        left:10px;
        right:10px;
        bottom:10px;
        z-index:90;
      }

      .mobile-cta a{
        width:100%;
        box-shadow:0 12px 35px rgba(0,0,0,.45);
      }
    }

    @media(max-width:500px){

      .container{
        width:min(var(--max),calc(100% - 26px));
      }

      .nav{
        min-height:68px;
      }

      .brand-name{
        font-size:13px;
      }

      .brand-sub{
        font-size:7px;
      }

      .brand-mark{
        width:34px;
        height:34px;
      }

      .nav-actions .btn{
        padding:10px 11px;
        font-size:9px;
      }

      .nav-actions .btn-primary{
        display:none;
      }

      h1{
        font-size:43px;
        letter-spacing:-2.5px;
      }

      .hero-actions{
        display:grid;
      }

      .hero-actions .btn{
        width:100%;
      }

      .opportunity-grid{
        grid-template-columns:1fr;
      }

      .node{
        font-size:8px;
        padding:7px 9px;
      }

      .node.people{
        top:5px;
      }

      .node.tasks{
        bottom:5px;
      }

      .rating-main{
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">

    <a href="#top" class="brand" aria-label="Indian Business Bureau">

      <div class="brand-mark">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">

          <path
            d="M8 6h10.5a6.5 6.5 0 0 1 0 13H8V6Z"
            stroke="#E5C675"
            stroke-width="2.4"
          />

          <path
            d="M8 19h11a6.5 6.5 0 0 1 0 13H8V19Z"
            stroke="#E5C675"
            stroke-width="2.4"
            transform="translate(0 -2.5) scale(.93)"
          />

        </svg>
      </div>

      <div class="brand-text">

        <div class="brand-name">
          Indian Business <span>Bureau</span>
        </div>

        <div class="brand-sub">
          People • Businesses • Opportunities
        </div>

      </div>

    </a>


    <nav class="nav-links">

      <a href="#how">How It Works</a>
      <a href="#opportunities">Opportunities</a>
      <a href="#business">Businesses</a>
      <a href="#reviews">Reviews</a>
      <a href="#faq">FAQ</a>

    </nav>


    <div class="nav-actions">

      <!-- Existing members -->
      <a href="login.html" class="btn btn-secondary">
        MEMBER LOGIN
      </a>
